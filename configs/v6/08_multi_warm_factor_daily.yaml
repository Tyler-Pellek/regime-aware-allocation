# v6 experiment: 08_multi_warm_factor_daily
#   Kitchen sink: multi + warm + factor + daily training.
#
# Dimensions: universe=multi, train_freq=1d, warm_start=True, head=factor

seed: 42
artifacts_dir: artifacts/reports/v6_08_multi_warm_factor_daily
data:
  kaggle_root: data/raw/kaggle_stock_market
  macro_cache: data/cache/macro.parquet
  start: '2003-01-01'
  end: '2020-04-01'
universe:
  tickers:
  - AAPL
  - MSFT
  - GOOGL
  - AMZN
  - NVDA
  - ORCL
  - CSCO
  - INTC
  - JPM
  - JNJ
  - XOM
  - PG
  - WMT
  - XLU
  - XLP
  - XLV
  - XLE
  - XLF
  - XLK
  - XLY
  - XLI
  - XLB
  - USMV
  - MTUM
  - QUAL
  - VLUE
  - QQQ
  - IWM
  - EFA
  - EEM
  - TLT
  - IEF
  - LQD
  - HYG
  - SHY
  - GLD
  - USO
  - VNQ
  min_history: 60
regime:
  n_states: 3
  covariance_type: full
  n_iter: 200
model:
  d_model: 192
  n_heads: 8
  n_layers: 5
  ff_mult: 4
  dropout: 0.15
  chol_min_diag: 0.01
  head_type: factor
  n_factors: 4
training:
  window: 60
  horizon: 5
  batch_size: 32
  epochs: 30
  lr: 0.0003
  weight_decay: 0.0005
  grad_clip: 1.0
  val_fraction: 0.15
  early_stop_patience: 6
  device: cpu
  anchor_lambda: 0.0
cvar:
  mode: mv
  risk_aversion: 25.0
  demean_mu: false
  alpha: 0.95
  turnover_lambda: 0.005
  long_only: true
  w_min: 0.0
  w_max: 0.15
  gross_max: 1.0
  cash_allowed: false
  min_invested: 0.0
  vol_cap_weekly: 0.04
  solver: CLARABEL
backtest:
  start: '2005-01-03'
  end: '2020-04-01'
  initial_train_end: '2007-12-31'
  rebal_freq_days: 5
  train_freq_days: 1
  fold_test_days: 252
  train_lookback_days: null
  transaction_cost_bps: 2.0
  shrinkage_alpha: 0.7
  use_model_mu: false
  warm_start: true
  warm_start_lr_scale: 0.5
  baselines:
  - equal_weight
  - inverse_vol
  - sample_cov_cvar
