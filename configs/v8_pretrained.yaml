# v8 = v7b features + universe-pretrained backbone.
#
# Lineage:
#   v6_03  : tech, warm-start + factor head, no extra features        Sharpe 1.04
#   v7b    : v6_03 + normalized OHLCV + yield-curve features          Sharpe 1.11
#   v8     : v7b + backbone PRETRAINED on 200-ticker universe (30x data)
#
# Architecture:
#   use_asset_pos=False        : universe-agnostic (REQUIRED for transfer)
#   head_type=factor           : universe-agnostic factor head
#   Pretrained weights loaded into fold 0; warm-start carries them forward
#   to subsequent folds (which also continue to expand training data).

seed: 42
artifacts_dir: artifacts/reports/v8_pretrained

features:
  include_ohlcv: true
  extended_macro: true

data:
  kaggle_root: data/raw/kaggle_stock_market
  macro_cache: data/cache/macro_extended.parquet
  start: "2003-01-01"
  end:   "2020-04-01"
  extend_via_yfinance: false   # apples-to-apples vs v7b

universe:
  tickers:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - FB
    - NFLX
    - NVDA
    - TSLA
    - ADBE
    - CRM
    - ORCL
    - INTC
    - CSCO
    - QCOM
    - IBM
    - TXN
  min_history: 60

regime:
  n_states: 3
  covariance_type: full
  n_iter: 200

model:
  d_model: 192
  n_heads: 8
  n_layers: 5
  ff_mult: 4
  dropout: 0.15
  chol_min_diag: 0.01
  head_type: factor
  n_factors: 4
  use_asset_pos: false      # IMPORTANT: match pretrain config

training:
  window: 60
  horizon: 5
  batch_size: 32
  epochs: 30
  lr: 0.00015               # lower than v7b (fine-tuning from pretrained)
  weight_decay: 0.0005
  grad_clip: 1.0
  val_fraction: 0.15
  early_stop_patience: 6
  device: cpu
  anchor_lambda: 0.0

cvar:
  mode: mv
  risk_aversion: 25.0
  demean_mu: false
  alpha: 0.95
  turnover_lambda: 0.005
  long_only: true
  w_min: 0.0
  w_max: 0.20
  gross_max: 1.0
  cash_allowed: false
  min_invested: 0.0
  vol_cap_weekly: 0.04
  solver: CLARABEL

backtest:
  start: "2005-01-03"
  end:   "2020-04-01"
  initial_train_end: "2007-12-31"
  rebal_freq_days: 5
  train_freq_days: 5
  fold_test_days: 252
  train_lookback_days: null
  transaction_cost_bps: 2.0
  shrinkage_alpha: 0.7
  use_model_mu: false
  warm_start: true                                  # carry weights fold-to-fold
  warm_start_lr_scale: 0.5
  pretrained_checkpoint: artifacts/pretrained/backbone.pt
  baselines:
    - equal_weight
    - inverse_vol
    - min_variance
    - max_sharpe
    - risk_parity
    - sample_cov_cvar
